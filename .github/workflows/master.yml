name: master
permissions:
  contents: read
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: aqua:jdx/hk aqua:dprint/dprint ruff aqua:astral-sh/uv python
      - run: hk check --all
      - run: mise run test
