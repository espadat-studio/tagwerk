name: aur
permissions:
  contents: read
on:
  push:
    branches: [master]
    # pkgver() counts commits, so a docs-only push would bump the AUR package
    # and make every user rebuild for nothing. Mirrors docs.yml's paths.
    paths-ignore: [docs/**, .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: tagwerk-git
          pkgbuild: contrib/aur/PKGBUILD
          assets: |
            contrib/aur/tagwerk-git.install
            contrib/aur/.gitignore
          test: true
          commit_username: sripwoud
          commit_email: me@sripwoud.xyz
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: tagwerk ${{ github.sha }}
