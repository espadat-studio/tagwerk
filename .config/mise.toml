[settings]
lockfile = true

[tasks.check]
alias = "c"
description = "Run all linters and formatters in check mode"
run = "hk check --all"

[tasks.fix]
alias = "f"
description = "Run all linters and formatters in fix mode"
run = "hk fix --all"

[tasks.test]
alias = "t"
description = "Run pytest then mypy strict on the module"
run = ["uv run pytest -q", "uv run mypy --strict tagwerk.py"]

[tools]
"aqua:astral-sh/uv" = "0.12.17"
"aqua:dprint/dprint" = "0.57.4"
# hk 2 moved the mise registry default to the packslip backend, which writes no
# urls or checksums to mise.lock, so `mise install --locked` cannot resolve it.
# The aqua backend still publishes hk and locks properly.
"aqua:jdx/hk" = "2.0.1"
"github:convco/convco" = "0.7.2"
node = "24.21.0"
python = "3.14.7"
ruff = "0.16.8"
